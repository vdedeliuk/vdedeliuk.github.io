<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vaysed — Telegram Sales &amp; Automation Systems</title>
  <desc id="desc">Black and white Vaysed social card with a geometric Telegram automation motif.</desc>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fff" fill-opacity=".7"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="945" cy="320" r="300" fill="url(#fade)"/>
  <circle cx="945" cy="320" r="232" fill="url(#dots)"/>
  <circle cx="945" cy="320" r="232" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <ellipse cx="945" cy="320" rx="232" ry="78" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <ellipse cx="945" cy="320" rx="78" ry="232" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <path d="M788 235h314M755 320h380M788 405h314" fill="none" stroke="#050505" stroke-opacity=".65" stroke-width="5"/>

  <rect x="72" y="62" width="166" height="58" fill="#fff"/>
  <text x="155" y="102" fill="#050505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="2">VAYSED</text>

  <path d="M72 184h82" stroke="#fff" stroke-width="3"/>
  <text x="178" y="193" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="7">TELEGRAM BOT AGENCY</text>

  <text x="72" y="304" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">AUTOMATE SALES</text>
  <text x="72" y="392" fill="none" stroke="#fff" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">IN TELEGRAM</text>

  <text x="76" y="476" fill="#b8b8b8" font-family="Arial, Helvetica, sans-serif" font-size="23">Payments → CRM → access → reminders → analytics</text>

  <line x1="72" y1="538" x2="1128" y2="538" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <text x="72" y="585" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">VAYSED.DEV</text>
  <text x="1128" y="585" fill="#fff" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">BUILT FOR BUSINESS</text>
</svg>
